# Local OpenAI-compatible gateway for MatFlow.
# The upstream credential is intentionally resolved from the environment.
model_list:
  - model_name: deepseek-chat
    litellm_params:
      model: openai/deepseek-chat
      api_key: os.environ/SJTU_ZHIYUAN_API_KEY
      api_base: https://models.sjtu.edu.cn/api/v1
  - model_name: deepseek-reasoner
    litellm_params:
      model: openai/deepseek-reasoner
      api_key: os.environ/SJTU_ZHIYUAN_API_KEY
      api_base: https://models.sjtu.edu.cn/api/v1
  - model_name: minimax
    litellm_params:
      model: openai/minimax
      api_key: os.environ/SJTU_ZHIYUAN_API_KEY
      api_base: https://models.sjtu.edu.cn/api/v1
  - model_name: glm
    litellm_params:
      model: openai/glm
      api_key: os.environ/SJTU_ZHIYUAN_API_KEY
      api_base: https://models.sjtu.edu.cn/api/v1
  - model_name: qwen
    litellm_params:
      model: openai/qwen
      api_key: os.environ/SJTU_ZHIYUAN_API_KEY
      api_base: https://models.sjtu.edu.cn/api/v1

general_settings:
  master_key: sk-local-wqs

litellm_settings:
  drop_params: true
