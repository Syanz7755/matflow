[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matflow"
version = "0.1.0"
description = "Schema-constrained materials workflow graph demo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<4.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.scripts]
matflow = "backend.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "httpx2>=2.13.0",
]

[tool.setuptools]
packages = ["backend"]
