[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matflow"
version = "1.1.0"
description = "Authoritative HTTP backend for schema-constrained materials workflows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "jsonschema>=4.23,<5.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "litellm[proxy]>=1.74,<2.0",
]

[project.scripts]
matflow = "backend.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "httpx2>=2.13.0",
]

[tool.setuptools.packages.find]
# Discovery rather than an explicit list: `backend.domain_packages` must ship with
# the wheel, and an in-repository Domain Package is a subpackage of `backend`.
# `flowview/` is intentionally excluded: it is a repository-local CLI tool run from the
# repository root, not part of the wheel. Do not add it to this include list.
include = ["backend*"]

[tool.setuptools.package-data]
"backend.domain_packages" = ["qe_demo_fixtures/*.in", "qe_demo_fixtures/*.log"]
